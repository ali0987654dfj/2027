<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fb">
  <title>منصة السادس</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">🎓</div>
        <div>
          <div class="hello">👋 هلا بك</div>
          <h1>منصة السادس</h1>
        </div>
      </div>
      <button class="icon-btn" aria-label="الإشعارات">♧</button>
    </header>

    <main>
      <section class="hero">
        <div class="hero-art">
          <div class="spark">✦</div>
          <div class="learn-box"><span>📖</span><b>تعلم</b></div>
        </div>
        <div class="hero-copy">
          <h2>🚀 ابدأ رحلتك الدراسية</h2>
          <p>رتّب دراستك وتابع محاضراتك<br>وحقق هدفك بثقة.</p>
          <button class="primary" onclick="scrollToSection('subjects')">ابدأ الدراسة</button>
        </div>
      </section>

      <section class="telegram-card">
        <div class="tg-icon">➤</div>
        <div class="tg-text">
          <strong>📢 انضم إلى قناتنا</strong>
          <span>تابع آخر الأخبار والتنبيهات والمحاضرات</span>
        </div>
        <a class="join" href="https://t.me/" target="_blank" rel="noopener">اشترك</a>
      </section>

      <div class="search-wrap">
        <span>⌕</span>
        <input id="search" type="search" placeholder="إبحث عن مدرس أو مادة" autocomplete="off">
      </div>

      <section id="subjects" class="section">
        <div class="section-head">
          <div>
            <h2>المواد الدراسية</h2>
            <p>اختر مادة وابدأ التعلم</p>
          </div>
        </div>
        <div id="subjectsGrid" class="horizontal-grid"></div>
      </section>

      <section id="teachers" class="section">
        <div class="section-head">
          <div>
            <h2>المدرسين</h2>
            <p>اختر مدرسك وتابع محاضراتك</p>
          </div>
        </div>
        <div id="teachersGrid" class="teachers-grid"></div>
      </section>

      <section id="continue" class="section">
        <div class="section-head">
          <div>
            <h2>تابع دراستك</h2>
            <p>آخر محاضرات متاحة لك</p>
          </div>
        </div>
        <div id="lecturesGrid" class="lecture-list"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" onclick="scrollToTop()"><span>⌂</span><b>الرئيسية</b></button>
      <button class="nav-item" onclick="scrollToSection('subjects')"><span>▣</span><b>المواد</b></button>
      <button class="nav-item" onclick="scrollToSection('teachers')"><span>♙</span><b>حسابي</b></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <div class="modal-card">
      <button class="close" onclick="closeModal()">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="app.js"></script>
</body>
</html>
